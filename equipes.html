    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="conteudo">

        <section class="dashboard pagina-equipes">


            <!-- TÍTULO -->

            <header class="titulo-pagina">

                <h1>MINHAS EQUIPES</h1>

            </header>



            <!-- =========================
                 ÁREA DAS EQUIPES
            ========================== -->

            <section class="area-equipes">


                <button
                    class="botao-criar-equipe"
                    id="abrirFormularioEquipe"

                >

                    <span class="simbolo-mais">+</span>

                    CRIAR EQUIPE

                </button>

                <!-- =================================
     FORMULÁRIO CRIAR EQUIPE
================================= -->

<div class="fundo-modal-equipe" id="fundoModalEquipe">

    <div class="modal-equipe">

        <h2>CRIAR EQUIPE</h2>


        <form id="formEquipe">

            <!-- NOME -->

            <label for="nomeEquipe">
                NOME DA EQUIPE
            </label>

            <input
                type="text"
                id="nomeEquipe"
                maxlength="50"
                required
            >


            <!-- DESCRIÇÃO -->

            <label for="descricaoEquipe">
                DESCRIÇÃO
            </label>

            <textarea
                id="descricaoEquipe"
                maxlength="300"
                rows="5"
                placeholder="Descreva brevemente a função desta equipe..."
            ></textarea>


            <!-- FUNCIONÁRIOS -->

            <p class="titulo-funcionarios-equipe">
                ADICIONAR FUNCIONÁRIOS
            </p>


            <div class="selecao-funcionarios">

                <label class="opcao-funcionario">
                    <input type="checkbox" value="Maria">
                    Maria
                </label>


                <label class="opcao-funcionario">
                    <input type="checkbox" value="Carlos">
                    Carlos
                </label>


                <label class="opcao-funcionario">
                    <input type="checkbox" value="João">
                    João
                </label>


                <label class="opcao-funcionario">
                    <input type="checkbox" value="Ana">
                    Ana
                </label>

            </div>


            <!-- BOTÕES -->

            <div class="botoes-formulario-equipe">

                <button
                    type="button"
                    id="cancelarEquipe"
                    class="botao-cancelar-equipe"
                >
                    CANCELAR
                </button>


                <button
                    type="submit"
                    class="botao-salvar-equipe"
                >
                    CRIAR EQUIPE
                </button>

            </div>

        </form>

    </div>

</div>


                <!-- =========================
                     ESTADO VAZIO
                ========================== -->

                <div class="estado-vazio-equipes">

                    <div class="balao-equipe">

                        PARECE QUE VOCÊ AINDA NÃO<br>
                        TEM NENHUMA EQUIPE!<br><br>

                        PRESSIONE “CRIAR EQUIPE”<br>
                        PARA COMEÇAR!

                    </div>


                    <div class="assistente">
                        IA
                    </div>

                </div>


                <!-- Futuramente o PHP colocará
                     os cards das equipes aqui -->

                <div class="lista-equipes">

                </div>


            </section>


        </section>
